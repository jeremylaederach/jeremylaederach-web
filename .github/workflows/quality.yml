name: Quality checks

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the checked main build to production
        type: boolean
        default: false
      backup_confirmed:
        description: A current website backup and restore path are confirmed
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  # Never interrupt an active production upload when another main push arrives.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: npm run build

      - name: Test frontend logic
        run: npm test

      - name: Audit dependencies
        run: |
          composer audit --locked --no-interaction
          npm audit --audit-level=high

      - name: Run code quality and tests
        run: composer test

      - name: Test deployment safeguards
        run: python3 -B -m unittest discover -s tests/deployment -v

      - name: Verify static deployment package
        run: npm run export:static

      - name: Validate production package
        run: python3 -B scripts/deploy_static.py --check-only dist-static

      - name: Save Hosttech upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosttech-${{ github.sha }}
          path: dist-static/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: quality
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
       (github.event_name == 'push' && vars.DEPLOY_AUTOMATIC == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://jeremylaederach.ch/en/

    steps:
      - name: Confirm first manual upload prerequisites
        if: github.event_name == 'workflow_dispatch'
        env:
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
        run: test "$BACKUP_CONFIRMED" = true

      - name: Check out deployment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the checked production package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hosttech-${{ github.sha }}
          path: dist-static/

      - name: Upload through verified FTPS and check the live website
        env:
          DEPLOY_FTP_USERNAME: ${{ secrets.DEPLOY_FTP_USERNAME }}
          DEPLOY_FTP_PASSWORD: ${{ secrets.DEPLOY_FTP_PASSWORD }}
        run: python3 -B scripts/deploy_static.py dist-static
